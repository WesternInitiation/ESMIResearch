steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - cloud_run/Dockerfile
      - -t
      - gcr.io/$PROJECT_ID/esmi-compress:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/esmi-compress:latest
      - .
images:
  - gcr.io/$PROJECT_ID/esmi-compress:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/esmi-compress:latest
